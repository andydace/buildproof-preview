<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">PlotVault — Capture, verify, comply</title>
<desc id="desc">Glossy dimensional navy and metallic blue PlotVault wordmark with a detailed house, chimney and four aligned windows.</desc>
<defs>
  <linearGradient id="roofFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d9f5ff"/><stop offset=".18" stop-color="#58b8e8"/>
    <stop offset=".48" stop-color="#17649e"/><stop offset="1" stop-color="#08294d"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9f5fc"/><stop offset="1" stop-color="#a9c9df"/>
  </linearGradient>
  <linearGradient id="navyText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#779bb8"/><stop offset=".12" stop-color="#315b80"/>
    <stop offset=".28" stop-color="#173d63"/><stop offset=".72" stop-color="#082542"/><stop offset="1" stop-color="#03162d"/>
  </linearGradient>
  <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d7f8ff"/><stop offset=".12" stop-color="#75dfff"/>
    <stop offset=".28" stop-color="#20a9e8"/><stop offset=".65" stop-color="#0871bd"/><stop offset="1" stop-color="#034477"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b9f0ff"/><stop offset=".35" stop-color="#269edc"/><stop offset="1" stop-color="#07518c"/>
  </linearGradient>
  <filter id="depth" x="-25%" y="-30%" width="155%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"/>
    <feOffset in="blur" dx="1" dy="5" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 .015 0 0 0 0 .08 0 0 0 0 .16 0 0 0 .42 0" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- House mark -->
<g transform="translate(14 13)" filter="url(#depth)">
  <!-- chimney, behind roof -->
  <path d="M67 54 V14 H96 V64" fill="url(#roofFace)" stroke="#0a3459" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 14 H99 V23 H64 Z" fill="#b9eaff" stroke="#164c76" stroke-width="3"/>
  <!-- roof shadow and roof -->
  <path d="M9 137 L128 42 L247 137" fill="none" stroke="#041c35" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 130 L128 36 L247 130" fill="none" stroke="url(#roofFace)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 124 L128 41 L232 124" fill="none" stroke="#e2f8ff" stroke-opacity=".72" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- house body -->
  <path d="M43 124 L128 58 L213 124 V213 H43 Z" fill="url(#wall)" stroke="#315f80" stroke-width="4"/>
  <path d="M52 129 L128 70 L204 129" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
  <!-- four evenly spaced windows, aligned to house body -->
  <g fill="url(#window)" stroke="#f8fdff" stroke-width="3">
    <rect x="70" y="137" width="39" height="34" rx="2"/>
    <rect x="147" y="137" width="39" height="34" rx="2"/>
    <rect x="70" y="181" width="39" height="25" rx="2"/>
    <rect x="147" y="181" width="39" height="25" rx="2"/>
  </g>
  <g stroke="#d8f5ff" stroke-width="2" opacity=".9">
    <path d="M89.5 137 V171 M166.5 137 V171 M89.5 181 V206 M166.5 181 V206"/>
    <path d="M70 154 H109 M147 154 H186"/>
  </g>
  <!-- curved foundation swoosh -->
  <path d="M8 229 C67 197 174 190 252 222 C183 207 91 215 8 241 Z" fill="#0a4c7d" opacity=".95"/>
  <path d="M8 225 C77 197 174 192 247 219" fill="none" stroke="#72d9ff" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- Dimensional wordmark -->
<g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-7" filter="url(#depth)">
  <text x="292" y="190" font-size="158" fill="#03172d" stroke="#03172d" stroke-width="8" paint-order="stroke">Plot</text>
  <text x="292" y="184" font-size="158" fill="url(#navyText)" stroke="#b6d2e5" stroke-width="2.5" paint-order="stroke">Plot</text>
  <text x="615" y="190" font-size="158" fill="#032344" stroke="#032344" stroke-width="8" paint-order="stroke">Vault</text>
  <text x="615" y="184" font-size="158" fill="url(#blueText)" stroke="#c5f2ff" stroke-width="2.5" paint-order="stroke">Vault</text>
  <text x="292" y="184" font-size="158" fill="url(#glass)" opacity=".72">Plot</text>
  <text x="615" y="184" font-size="158" fill="url(#glass)" opacity=".76">Vault</text>
</g>

<!-- Strapline and fine rules -->
<g fill="none" stroke="#4d8bb8" stroke-width="2" opacity=".85">
  <path d="M306 235 H432"/>
  <path d="M793 235 H919"/>
</g>
<text x="612" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="1.4" fill="#143b5d">Capture, verify, comply</text>
</svg>